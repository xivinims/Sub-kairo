name: TreeWorld Bridge Ruins DarkZone V7

on:
  push:
    branches:
      - roblox-publisher
    paths:
      - "treeworld-v7/**"
      - ".github/workflows/treeworld-v7.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roblox-universe-9421311218-place-118064584465155-v7
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Publish and verify TreeWorld v7
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node treeworld-v7/publish.mjs
