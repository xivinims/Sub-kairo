name: FPS Server Size

on:
  push:
    branches: [dead-signal-publisher]
    paths:
      - "dead-signal-publisher/fps-server-size.trigger"

permissions:
  contents: read

concurrency:
  group: roblox-fps-server-size-9421311218
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check the server-size updater
        run: node --check dead-signal-publisher/fps-server-size-release.mjs
      - name: Set the FPS place to ten players and restart servers
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node dead-signal-publisher/fps-server-size-release.mjs
