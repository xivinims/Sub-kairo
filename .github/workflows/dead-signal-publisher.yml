name: Dead Signal Publisher

on:
  push:
    branches:
      - dead-signal-publisher
    paths:
      - "dead-signal-publisher/preview.trigger"

permissions:
  contents: read

concurrency:
  group: dead-signal-publisher-9421311218-9421505041
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout dead signal publisher branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate publisher and source syntax
        run: |
          node --check dead-signal-publisher/publish.mjs
          node --check dead-signal-publisher/hotel-native-publish.mjs
          node --check dead-signal-publisher/hotel-build.mjs
          node dead-signal-publisher/publish.mjs --dry-run

      - name: Run Roblox preview preflight without publishing
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node dead-signal-publisher/publish.mjs --preview

      - name: Publish the verified hotel build
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-hotel]')
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node dead-signal-publisher/publish.mjs
