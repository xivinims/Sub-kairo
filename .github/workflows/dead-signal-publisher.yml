name: Dead Signal Publisher

on:
  workflow_dispatch:
  push:
    branches:
      - dead-signal-publisher
    paths:
      - "dead-signal-publisher/release.trigger"

permissions:
  contents: read

concurrency:
  group: dead-signal-publisher-9421311218-9421505041
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dead signal publisher branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: dead-signal-publisher
          persist-credentials: false

      - name: Validate publisher syntax
        run: node --check dead-signal-publisher/publish.mjs

      - name: Publish and verify Dead Signal social lobby
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node dead-signal-publisher/publish.mjs
