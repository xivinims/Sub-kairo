name: Restore Pristine Original FPS Place
on:
  push:
    branches: [dead-signal-publisher]
    paths:
      - "dead-signal-publisher/fps-restore-pristine-original.trigger"
permissions:
  contents: read
concurrency:
  group: roblox-fps-pristine-reset-9421311218
  cancel-in-progress: false
jobs:
  restore-original:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check restore runner syntax
        run: node --check dead-signal-publisher/fps-restore-pristine-original.mjs
      - name: Replace the target place with the exact Roblox FPS original
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node dead-signal-publisher/fps-restore-pristine-original.mjs
