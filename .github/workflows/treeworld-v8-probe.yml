name: TreeWorld V8 Geometry Inspection
on:
  push:
    branches: [roblox-publisher]
    paths: ["treeworld-v8/probe.*", ".github/workflows/treeworld-v8-probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inspect current house and bridge geometry without saving
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node treeworld-v8/probe.mjs
