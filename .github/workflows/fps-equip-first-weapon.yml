name: Reactivate Original FPS Weapon Equip
on:
  push:
    branches: [dead-signal-publisher]
    paths:
      - "dead-signal-publisher/fps-equip-first-weapon.trigger"
permissions:
  contents: read
concurrency:
  group: roblox-fps-equip-first-weapon-9421311218
  cancel-in-progress: false
jobs:
  patch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check one-line weapon patch scripts
        run: node --check dead-signal-publisher/fps-equip-first-weapon-release.mjs
      - name: Publish original auto-equip behavior
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node dead-signal-publisher/fps-equip-first-weapon-release.mjs
