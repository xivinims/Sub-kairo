name: TreeWorld V8 House Entrance and Grounded Bridges
on:
  push:
    branches: [roblox-publisher]
    paths: ["treeworld-v8/patch.luau", "treeworld-v8/verify.luau", "treeworld-v8/publish.mjs", ".github/workflows/treeworld-v8.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roblox-universe-9421311218-place-118064584465155-v8
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check publisher syntax
        run: node --check treeworld-v8/publish.mjs
      - name: Repair, check actual collisions, save, and verify persisted place
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node treeworld-v8/publish.mjs
