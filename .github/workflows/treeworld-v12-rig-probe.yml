name: Inspect R15 joints
on:
  push:
    branches: [roblox-publisher]
    paths: ["treeworld-v12/rig-probe.mjs", ".github/workflows/treeworld-v12-rig-probe.yml"]
permissions:
  contents: read
concurrency:
  group: overyard-place-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate publisher syntax
        run: node --check treeworld-v12/rig-probe.mjs
      - name: Build, verify, save and reload the forest
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node treeworld-v12/rig-probe.mjs
