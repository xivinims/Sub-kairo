name: Survivors Polish Probe
on:
  push:
    branches: [roblox-publisher]
    paths:
      - 'roblox-integrations/suvivers-polish/**'
      - '.github/workflows/suvivers-polish-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inspect live Survivors place
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node roblox-integrations/suvivers-polish/probe.mjs
