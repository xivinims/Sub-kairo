name: TreeWorld V5 Verify Saved Place

on:
  push:
    branches:
      - roblox-publisher
    paths:
      - "treeworld-v5-check/**"
      - ".github/workflows/treeworld-v5-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify saved v5 place
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node treeworld-v5-check/verify.mjs
