name: Suvivers Expansion Audit
on:
  push:
    branches: [roblox-publisher]
    paths:
      - 'roblox-integrations/suvivers-audit/**'
      - '.github/workflows/suvivers-expansion-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inspect map assets without publishing
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node roblox-integrations/suvivers-audit/audit.mjs
