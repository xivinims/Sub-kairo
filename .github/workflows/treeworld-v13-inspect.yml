name: Inspect Caio audio and touch blockers
on:
  push:
    branches: [roblox-publisher]
    paths: [".github/workflows/treeworld-v13-inspect.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          import {execute,first} from './treeworld-v12/cloud.mjs';
          const result=first(await execute(`
          local result={version=game.PlaceVersion,voices={},ui={},errors={}}
          local voices=require(game.ReplicatedStorage.LivingForest.VoiceManifest)
          local content=game:GetService('ContentProvider')
          local connection=game:GetService('LogService').MessageOut:Connect(function(message,kind)
           if kind==Enum.MessageType.MessageError and #result.errors<20 then table.insert(result.errors,message)end
          end)
          local completed=0
          for name,id in pairs(voices)do
           local row={name=name,id=id};table.insert(result.voices,row)
           task.spawn(function()
            local sound=Instance.new('Sound');sound.SoundId='rbxassetid://'..id;sound.Parent=game:GetService('SoundService')
            local ok,err=pcall(function()content:PreloadAsync({sound},function(_,status)row.status=tostring(status)end)end)
            row.ok=ok;row.error=not ok and tostring(err)or nil;row.loaded=sound.IsLoaded;row.length=sound.TimeLength
            sound:Destroy();completed+=1
           end)
          end
          local deadline=os.clock()+35;while completed<#result.voices and os.clock()<deadline do task.wait(.2)end
          connection:Disconnect()
          local gui=game.StarterGui:FindFirstChild('Custom Inventory')
          if gui then for _,p in ipairs(gui:GetDescendants())do
           if p:IsA('GuiObject')then table.insert(result.ui,{path=p:GetFullName(),class=p.ClassName,active=p.Active,visible=p.Visible,size=tostring(p.Size),position=tostring(p.Position),modal=p:IsA('GuiButton')and p.Modal or nil})
           elseif p:IsA('UISizeConstraint')then table.insert(result.ui,{path=p:GetFullName(),min=tostring(p.MinSize),max=tostring(p.MaxSize)})end
          end end
          return result`));
          console.log(JSON.stringify(result));
          JS
