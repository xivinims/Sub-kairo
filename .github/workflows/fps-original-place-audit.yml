name: Audit Original FPS Place
on:
  push:
    branches: [dead-signal-publisher]
    paths:
      - "dead-signal-publisher/fps-original-place-audit.trigger"
permissions:
  contents: read
concurrency:
  group: roblox-fps-original-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: node --check dead-signal-publisher/fps-original-place-audit.mjs
      - name: Inspect the pinned FPS template without publishing
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node dead-signal-publisher/fps-original-place-audit.mjs
