name: Overyard V12 Inspect Requested Models
on:
  push:
    branches: [roblox-publisher]
    paths: ["treeworld-v12/probe.*", ".github/workflows/treeworld-v12-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inspect without executing imported scripts or saving the place
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node treeworld-v12/probe.mjs
