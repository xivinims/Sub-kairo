name: Overyard V12 Portuguese NPC Voice
on:
  push:
    branches: [roblox-publisher]
    paths: ["treeworld-v12/upload-voices.mjs", ".github/workflows/treeworld-v12-voices.yml"]
permissions:
  contents: read
jobs:
  voices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Upload original Portuguese NPC narration
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node treeworld-v12/upload-voices.mjs
