name: Overyard V12 Living Forest and R15 Caio
on:
  push:
    branches: [roblox-publisher]
    paths: ["treeworld-v12/publish.mjs", "treeworld-v12/*.luau", "treeworld-v12/vendor/*.luau", ".github/workflows/treeworld-v12-publish.yml"]
permissions:
  contents: read
concurrency:
  group: overyard-place-publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate publisher syntax
        run: node --check treeworld-v12/publish.mjs
      - name: Build, verify, save and reload the forest
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node treeworld-v12/publish.mjs
