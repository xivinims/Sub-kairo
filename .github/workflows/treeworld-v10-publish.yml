name: Overyard V10 Nine Photo Environments
on:
  push:
    branches: [roblox-publisher]
    paths: ["treeworld-v10/*.luau", "treeworld-v10/publish.mjs", ".github/workflows/treeworld-v10-publish.yml"]
permissions:
  contents: read
concurrency:
  group: overyard-place-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate publisher syntax
        run: node --check treeworld-v10/publish.mjs
      - name: Rebuild, validate routes, save and verify the nine photo environments
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node treeworld-v10/publish.mjs
