name: Inspect requested boss assets
on:
  push:
    branches: [roblox-publisher]
    paths: ['mage-duel-v2/probe.*', '.github/workflows/overyard-mage-duel-v2-probe.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node mage-duel-v2/probe.mjs
