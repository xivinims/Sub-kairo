name: Overyard Loading Logo V8

on:
  push:
    branches:
      - roblox-publisher
    paths:
      - "treeworld-loading-logo-v8/**"
      - ".github/workflows/overyard-loading-logo-v8.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roblox-universe-9421311218-place-118064584465155-loading-logo-v8
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Normalize Overyard logo
        run: |
          python -m pip install --quiet pillow
          curl -fsSL https://overyard-logo-temp.vercel.app/logo.jpg -o /tmp/overyard-logo-source.jpg
          python -c "from PIL import Image; im=Image.open('/tmp/overyard-logo-source.jpg').convert('RGB'); im.save('/tmp/overyard-logo.jpg','JPEG',quality=90,optimize=True,progressive=False)"
      - name: Upload logo, patch loading screen, and verify
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          OVERYARD_LOGO_FILE: /tmp/overyard-logo.jpg
        run: node treeworld-loading-logo-v8/publish.mjs
