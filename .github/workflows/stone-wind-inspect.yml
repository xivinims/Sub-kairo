name: Inspect Sakura Stone and Wind

on:
  push:
    branches: [roblox-publisher]
    paths:
      - 'roblox-diagnostics/stone-wind-inspect.mjs'
      - '.github/workflows/stone-wind-inspect.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inspect current Roblox place
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node roblox-diagnostics/stone-wind-inspect.mjs
