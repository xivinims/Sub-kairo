name: Probe Overyard Live Map V14

on:
  push:
    branches: [roblox-publisher]
    paths:
      - "treeworld-live-probe-v14/**"
      - ".github/workflows/overyard-live-probe-v14.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node treeworld-live-probe-v14/probe.mjs
