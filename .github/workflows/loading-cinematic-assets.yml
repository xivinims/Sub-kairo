name: Loading Cinematic Asset Inspect

on:
  workflow_dispatch:
  push:
    branches: [roblox-publisher]
    paths:
      - 'roblox-live-verify/loading-assets.mjs'
      - '.github/workflows/loading-cinematic-assets.yml'

permissions:
  contents: read

concurrency:
  group: loading-cinematic-assets
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inspect loading assets
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node roblox-live-verify/loading-assets.mjs
