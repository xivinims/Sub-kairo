name: Suvivers Lobby Live Verify

on:
  workflow_dispatch:
  push:
    branches: [roblox-publisher]
    paths:
      - 'roblox-live-verify/suvivers-lobby.mjs'
      - '.github/workflows/suvivers-lobby-live-verify.yml'

permissions:
  contents: read

concurrency:
  group: suvivers-lobby-live-verify
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify published lobby
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node roblox-live-verify/suvivers-lobby.mjs
