name: Inspect Fallout FPS map asset

on:
  push:
    branches: [dead-signal-publisher]
    paths:
      - "dead-signal-publisher/fps-fallout-map-inspect.trigger"

permissions:
  contents: read

jobs:
  inspect-map:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate map inspector
        run: node --check dead-signal-publisher/fps-fallout-map-inspect.mjs
      - name: Inspect exact Fallout map asset before merging
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node dead-signal-publisher/fps-fallout-map-inspect.mjs
