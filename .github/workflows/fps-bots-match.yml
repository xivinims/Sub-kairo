name: FPS Bots in Match

on:
  push:
    branches: [dead-signal-publisher]
    paths:
      - "dead-signal-publisher/fps-bots-match.trigger"

permissions:
  contents: read

concurrency:
  group: roblox-fps-match-bots-9421311218
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate release runner syntax
        run: node --check dead-signal-publisher/fps-bots-match-release.mjs
      - name: Native Roblox match-only bots preflight or release
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node dead-signal-publisher/fps-bots-match-release.mjs
