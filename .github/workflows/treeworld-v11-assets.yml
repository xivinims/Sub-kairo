name: Overyard V11 Refined Leaves and Shore Plants
on:
  push:
    branches: [roblox-publisher]
    paths: ["treeworld-v11/build_assets.py", "treeworld-v11/upload-assets.mjs", ".github/workflows/treeworld-v11-assets.yml"]
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build and validate original mesh geometry
        run: |
          python -m pip install --quiet numpy
          python treeworld-v11/build_assets.py
          node --check treeworld-v11/upload-assets.mjs
      - name: Upload and inspect mesh library without changing the map
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node treeworld-v11/upload-assets.mjs
