name: Suvivers Fill Ghost Hotfix

on:
  workflow_dispatch:
  push:
    branches: [roblox-publisher]
    paths:
      - 'roblox-live-verify/suvivers-fill-ghost-hotfix.mjs'
      - '.github/workflows/suvivers-fill-ghost-hotfix.yml'

permissions:
  contents: read

concurrency:
  group: suvivers-fill-ghost-hotfix-v1
  cancel-in-progress: true

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Apply Fill ghost collision hotfix
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node roblox-live-verify/suvivers-fill-ghost-hotfix.mjs
