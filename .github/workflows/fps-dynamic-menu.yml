name: FPS Dynamic Menu

on:
  push:
    branches: [dead-signal-publisher]
    paths:
      - "dead-signal-publisher/fps-dynamic-menu.trigger"

permissions:
  contents: read

concurrency:
  group: roblox-fps-menu-9421311218
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check release runner syntax
        run: node --check dead-signal-publisher/fps-dynamic-menu-release.mjs
      - name: Restore verified FPS source, install the sliding menu, and publish
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node dead-signal-publisher/fps-dynamic-menu-release.mjs
