name: Nextbot reference asset audit and interface preview
on:
  push:
    branches: [dead-signal-publisher]
    paths: ['nextbot-rebuild/audit.trigger']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Inspect models without executing their scripts and compile preview
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node nextbot-rebuild/audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nextbot-reference-audit
          path: /tmp/nb-assets/
          retention-days: 14
