name: TreeWorld Full Forest Rebuild

on:
  push:
    branches:
      - roblox-publisher
    paths:
      - "treeworld-rebuild-v2/**"
      - ".github/workflows/treeworld-rebuild-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roblox-universe-9421311218-place-118064584465155-rebuild-v2
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout rebuild source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Rebuild TreeWorld and verify fresh saved version
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node treeworld-rebuild-v2/publish.mjs
