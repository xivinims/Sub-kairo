name: FPS Tactical HUD and Practice Bots

on:
  push:
    branches: [dead-signal-publisher]
    paths:
      - "dead-signal-publisher/fps-bots-hud.trigger"

permissions:
  contents: read

concurrency:
  group: roblox-fps-combat-9421311218
  cancel-in-progress: false

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check JavaScript release runner
        run: node --check dead-signal-publisher/fps-bots-hud-release.mjs
      - name: Validate source and isolated Roblox place
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node dead-signal-publisher/fps-bots-hud-release.mjs
