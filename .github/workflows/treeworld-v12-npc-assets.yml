name: Overyard NPC exact assets
on:
  push:
    branches: [roblox-publisher]
    paths: [.github/workflows/treeworld-v12-npc-assets.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Upload original clothes and report narration
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node treeworld-v12/upload-npc-assets.mjs
      - name: Inspect feedback and R15 parts
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node treeworld-v12/probe-npc.mjs
