name: Inspect a public R6 running model (read-only)
on:
  push:
    branches: [dead-signal-publisher]
    paths: ['r6-test/free-run.trigger']
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download original public R6 run model for inspection
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node r6-test/inspect-free-run.mjs
      - name: Install Lune for model inventory
        run: |
          curl -fsSL https://github.com/lune-org/lune/releases/download/v0.11.1/lune-0.11.1-linux-x86_64.zip -o /tmp/lune.zip
          echo '39859282ce677fce19e6eb45c37596a90a25c324c95b4e7e02d428b6cae294a1  /tmp/lune.zip' | sha256sum --check
          unzip -q /tmp/lune.zip -d /tmp/r6-inspect
          chmod +x /tmp/r6-inspect/lune
      - name: Inspect R6 animation source without modifications
        run: /tmp/r6-inspect/lune run r6-test/inspect-free-run.luau
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-r6-run-source-readonly
          path: r6-test/free-r6-run-model.rbxm
