name: Overyard Broadcast Live Update

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Optional release label
        required: false
        type: string

permissions:
  contents: read

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Move live servers to latest Overyard version
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: node treeworld-update-migration-v1/broadcast.mjs
