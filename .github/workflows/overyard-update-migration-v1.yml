name: Overyard Update Migration V1

on:
  push:
    branches:
      - roblox-publisher
    paths:
      - "treeworld-update-migration-v1/**"
      - ".github/workflows/overyard-update-migration-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roblox-universe-9421311218-place-118064584465155-update-migration-v1
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install and verify live update migration
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node treeworld-update-migration-v1/publish.mjs
