name: Import TreeWorld user lamp
on:
  push:
    branches: [roblox-publisher]
    paths: ["roblox-integrations/forest96/import-lamp.mjs"]
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node roblox-integrations/forest96/import-lamp.mjs
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
