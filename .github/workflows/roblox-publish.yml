name: Publish Roblox Place

on:
  push:
    branches:
      - roblox-publisher
    paths:
      - "roblox-publisher/**"
      - ".github/workflows/roblox-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roblox-universe-9421311218-place-118064584465155
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout approved publisher source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Publish full Mon Calamari City and verify saved version
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node roblox-publisher/publish.mjs
