name: TreeWorld V3 Final Verify

on:
  push:
    branches:
      - roblox-publisher
    paths:
      - "treeworld-v3-verify2/**"
      - ".github/workflows/treeworld-v3-final-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify saved TreeWorld v3
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node treeworld-v3-verify2/verify.mjs
