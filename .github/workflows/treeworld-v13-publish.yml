name: Fix Caio voice and backpack touch input
on:
  push:
    branches: [roblox-publisher]
    paths:
      - 'treeworld-v13/*.luau'
      - 'treeworld-v13/publish.mjs'
      - '.github/workflows/treeworld-v13-publish.yml'
permissions:
  contents: read
concurrency:
  group: overyard-place-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate, save, verify, and migrate
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node treeworld-v13/publish.mjs
