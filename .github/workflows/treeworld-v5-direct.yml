name: TreeWorld Torii V5 Direct Publish

on:
  push:
    branches:
      - roblox-publisher
    paths:
      - "treeworld-v5-direct/**"
      - ".github/workflows/treeworld-v5-direct.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roblox-universe-9421311218-place-118064584465155-v5-direct
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Publish Torii forest v5 directly
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node treeworld-v5-direct/publish.mjs
