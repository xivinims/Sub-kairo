name: Overyard Transparent Loading Final Check

on:
  push:
    branches:
      - roblox-publisher
    paths:
      - "treeworld-loading-logo-v10-check/**"
      - ".github/workflows/overyard-loading-logo-v10-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Wait for transparent logo approval, verify v115 and migrate
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node treeworld-loading-logo-v10-check/check.mjs
