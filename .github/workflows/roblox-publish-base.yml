name: Publish Dead Signal base
on:
  push:
    branches: [roblox-publisher]
    paths: ['scripts/publish-base.mjs', '.github/workflows/roblox-publish-base.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dead-signal-9421311218-118064584465155
  cancel-in-progress: false
jobs:
  publish-base:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned official tools
        run: python3 scripts/install-tools.py
      - name: Compile, test and build
        run: python3 scripts/check.py --luau .tools/luau/luau --compiler .tools/luau/luau-compile --rojo .tools/rojo/rojo
      - name: Verify imported models in the Roblox engine before publishing
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node scripts/verify-published.mjs
      - name: Publish base to the verified Dead Signal place
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node scripts/publish-base.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Dead-Signal-base-publication
          path: dist/
          if-no-files-found: error
