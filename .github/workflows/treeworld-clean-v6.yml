name: TreeWorld Clean Reference V6

on:
  push:
    branches:
      - roblox-publisher
    paths:
      - "treeworld-clean-v6/**"
      - ".github/workflows/treeworld-clean-v6.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roblox-universe-9421311218-place-118064584465155-clean-v6
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reset, publish clean reference map, and verify
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node treeworld-clean-v6/publish.mjs
