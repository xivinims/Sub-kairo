name: Inspect Caio avatar base
on:
  push:
    branches: [roblox-publisher]
    paths: ['.github/workflows/treeworld-v14-avatar-inspect.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          import {execute,first} from './treeworld-v12/cloud.mjs';
          const result=first(await execute(`
          local d=game.Players:GetHumanoidDescriptionFromUserIdAsync(8344738123)
          local out={version=game.PlaceVersion,base={},accessories={}}
          for _,key in ipairs({'Head','Torso','LeftArm','RightArm','LeftLeg','RightLeg','Face','Shirt','Pants','BodyTypeScale','ProportionScale','WidthScale','DepthScale','HeightScale','HeadScale','IdleAnimation','WalkAnimation','RunAnimation'})do out.base[key]=d[key]end
          for _,key in ipairs({'HeadColor','TorsoColor','LeftArmColor','RightArmColor','LeftLegColor','RightLegColor'})do local c=d[key];out.base[key]={c.R,c.G,c.B}end
          for _,a in ipairs(d:GetAccessories(true))do table.insert(out.accessories,{id=a.AssetId,type=tostring(a.AccessoryType)})end
          d:Destroy()
          return out`));
          console.log(JSON.stringify({stage:'avatar-base',...result}));
          JS
