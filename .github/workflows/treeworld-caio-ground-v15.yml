name: Fix Caio Ground V15

on:
  push:
    branches: [roblox-publisher]
    paths:
      - "treeworld-caio-ground-v15/fix.luau"
      - "treeworld-caio-ground-v15/verify.luau"
      - "treeworld-caio-ground-v15/publish.mjs"
      - ".github/workflows/treeworld-caio-ground-v15.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: overyard-place-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Ground Caio against physical terrain and verify
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node treeworld-caio-ground-v15/publish.mjs
