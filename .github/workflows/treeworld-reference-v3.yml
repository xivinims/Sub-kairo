name: TreeWorld Reference Rebuild V3

on:
  push:
    branches:
      - roblox-publisher
    paths:
      - "treeworld-rebuild-v3/**"
      - ".github/workflows/treeworld-reference-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roblox-universe-9421311218-place-118064584465155-reference-v3
  cancel-in-progress: false

jobs:
  rebuild-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout reference rebuild
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Publish reference-matched TreeWorld v3 and verify
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node treeworld-rebuild-v3/publish.mjs
