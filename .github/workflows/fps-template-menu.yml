name: Restore Roblox FPS System Demo with Reference Menu

on:
  push:
    branches: [dead-signal-publisher]
    paths:
      - "dead-signal-publisher/fps-template-menu.trigger"

permissions:
  contents: read

concurrency:
  group: roblox-fps-template-menu-9421311218
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate release runner syntax
        run: node --check dead-signal-publisher/fps-template-menu-release.mjs
      - name: Verify template and prepare screenshot menu
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node dead-signal-publisher/fps-template-menu-release.mjs
