name: Fix real R6 running and combat poses
on:
  push:
    branches: [dead-signal-publisher]
    paths: ['r6-test/publish.trigger']
permissions:
  contents: write
concurrency:
  group: roblox-water-rpg-9421311218
  cancel-in-progress: false
jobs:
  arena:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Install verified Luau runtime
        run: |
          curl -fsSL https://github.com/lune-org/lune/releases/download/v0.11.1/lune-0.11.1-linux-x86_64.zip -o /tmp/lune.zip
          echo '39859282ce677fce19e6eb45c37596a90a25c324c95b4e7e02d428b6cae294a1  /tmp/lune.zip' | sha256sum --check
          unzip -q /tmp/lune.zip -d /tmp/water-lune
          chmod +x /tmp/water-lune/lune
      - name: Recover user's original Naruto package from previous saved test
        run: |
          git fetch --no-tags --depth=1 origin e3bb564c600660303b5507c6ce1f34be1937a2dd
          git show e3bb564c600660303b5507c6ce1f34be1937a2dd:r6-test/arena.rbxl > r6-test/naruto-archive-v6.rbxl
      - name: Check selected Forsaken R6 sprint assets without blocking build
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          node --check r6-test/run-probe-quick.mjs
          node r6-test/run-probe-quick.mjs
      - name: Probe all thirteen requested R6 combat animation IDs
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          node --check r6-test/combat-probe.mjs
          node r6-test/combat-probe.mjs
      - name: Build combat animation set and preserve existing R6 systems
        run: /tmp/water-lune/lune run r6-test/repair-avatar.luau
      - name: Validate Naruto R6 scripts against uploaded file hashes
        run: |
          node --check r6-test/publish.mjs
          node --check r6-test/run-probe-quick.mjs
          node --check r6-test/combat-probe.mjs
          /tmp/water-lune/lune run r6-test/check.luau
      - name: Publish private animation test and verify native R6 creation
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node r6-test/publish.mjs
      - name: Save published R6 repair to the branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add r6-test/arena.rbxl r6-test/animation-manifest.json r6-test/forbidden-or-available-run-ids.json r6-test/combat-probe.json
          if ! git diff --cached --quiet; then
            git commit -m 'Replace stiff R15 running and combat with actual R6 motor poses'
            git push origin HEAD:dead-signal-publisher
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r6-arena-verification
          path: |
            r6-test/publication.json
            r6-test/arena.rbxl
            r6-test/backup-before-arena.rbxl
