name: Inspect live camera ownership
on:
  push:
    branches: [roblox-publisher]
    paths: [".github/workflows/treeworld-v12-camera-probe.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: |
          node --input-type=module <<'JS'
          import {execute,first} from './treeworld-v12/cloud.mjs';
          console.log(JSON.stringify(first(await execute(`
          local result={version=game.PlaceVersion,scripts={},starter={mode=tostring(game.StarterPlayer.CameraMode),min=game.StarterPlayer.CameraMinZoomDistance,max=game.StarterPlayer.CameraMaxZoomDistance,computer=tostring(game.StarterPlayer.DevComputerCameraMovementMode),touch=tostring(game.StarterPlayer.DevTouchCameraMovementMode)}}
          for _,container in ipairs({game.StarterGui,game.StarterPlayer,game.ReplicatedFirst})do
           for _,p in ipairs(container:GetDescendants())do
            if p:IsA('LuaSourceContainer')then
             local source=p.Source
             if source:find('CameraType',1,true)or source:find('GetControls',1,true)or source:find('CameraMode',1,true)or source:find('CameraSubject',1,true)then
              table.insert(result.scripts,{path=p:GetFullName(),source=source})
             end
            end
           end
          end
          return result`))));
          JS
