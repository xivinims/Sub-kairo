name: TreeWorld UI Zone Hotfix

on:
  push:
    branches:
      - roblox-publisher
    paths:
      - "treeworld-hotfix/**"
      - ".github/workflows/treeworld-ui-hotfix.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roblox-universe-9421311218-place-118064584465155-ui-hotfix
  cancel-in-progress: false

jobs:
  publish-ui-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hotfix source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Publish precise TreeWorld UI zones and verify
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
        run: node treeworld-hotfix/publish-ui-hotfix.mjs
